# Import this repository as a Blueprint in Render.
services:
  - type: web
    name: the-work-suites-api
    runtime: node
    plan: free
    rootDir: server
    buildCommand: npm ci
    startCommand: npm start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_VERSION
        value: 24.x
      - key: NODE_ENV
        value: production
      - key: MONGODB_URI
        sync: false
      - key: CLIENT_URL
        sync: false
      - key: JWT_SECRET
        generateValue: true
      - key: PAYMENT_PROVIDER
        value: disabled
      - key: DEV_EMAIL_CAPTURE
        value: "false"
